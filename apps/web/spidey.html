<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The neighbour, up close</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; background: #14161d; overflow: hidden; }
      canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
      canvas:active { cursor: grabbing; }
      #hud {
        position: fixed; left: 18px; bottom: 16px; margin: 0;
        font: 500 12px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .06em; text-transform: uppercase; color: #8e93a3;
      }
      #hud b { color: #e7eaf3; font-weight: 600; }
      #pose { position: fixed; left: 18px; top: 16px; margin: 0;
        font: 600 22px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
        text-transform: uppercase; color: #e7eaf3; }
    </style>
  </head>
  <body>
    <canvas id="gl"></canvas>
    <p id="pose">perch</p>
    <p id="hud">
      drag orbit · wheel zoom · <b>space</b> pose · <b>r</b> spin · <b>w</b> wireframe · <b>b</b> backfaces
    </p>
    <script type="module" src="/src/spidey/spidey.js"></script>
